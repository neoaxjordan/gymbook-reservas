<div class="flex align-items-center justify-content-center min-h-screen bg-gray-50">
  <p-card styleClass="w-full md:w-4 shadow-3">

    <ng-template pTemplate="header">
      <div class="text-center pt-4 pb-2">
        <h1 class="text-2xl font-bold text-gray-800 m-0">GymBook</h1>
        <p class="text-gray-500 mt-1">Crea tu cuenta</p>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <div class="field mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input pInputText formControlName="name" type="text"
               placeholder="Tu nombre completo" class="w-full" />
        <small class="text-red-500">{{ getError(form.get('name')) }}</small>
      </div>

      <div class="field mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input pInputText formControlName="email" type="email"
               placeholder="tu@email.com" class="w-full" />
        <small class="text-red-500">{{ getError(form.get('email')) }}</small>
      </div>

      <div class="field mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input pInputText formControlName="password" type="password"
               placeholder="••••••••" class="w-full" />
        <small class="text-red-500">{{ getError(form.get('password')) }}</small>
      </div>

      <div class="field mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
        <input pInputText formControlName="confirmPassword" type="password"
               placeholder="••••••••" class="w-full" />
        <small class="text-red-500">{{ getError(form.get('confirmPassword')) }}</small>
      </div>

      @if (form.errors?.['passwordMismatch'] && form.touched) {
        <p-message severity="error" text="Las contraseñas no coinciden." styleClass="w-full mb-3" />
      }

      @if (error) {
        <p-message severity="error" [text]="error" styleClass="w-full mb-3" />
      }

      <p-button type="submit" label="Registrarse" styleClass="w-full"
                [loading]="loading" />

    </form>

    <ng-template pTemplate="footer">
      <p class="text-center text-sm text-gray-500 mt-2">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-primary font-medium">Inicia sesión</a>
      </p>
    </ng-template>

  </p-card>
</div>
