<p-toast />

<div class="max-w-4xl mx-auto py-6">
  <h2 class="text-2xl font-bold text-gray-800 mb-5">Clases disponibles</h2>

  <!-- Skeleton loader -->
  @if (loading) {
    <div class="grid">
      @for (i of [1,2,3,4]; track i) {
        <div class="col-12 md:col-6 mb-3">
          <p-skeleton height="140px" borderRadius="12px" />
        </div>
      }
    </div>
  }

  <!-- Lista de clases -->
  @if (!loading) {
    <div class="grid">
      @for (class of classes; track class.id) {
        <div class="col-12 md:col-6 mb-3">
          <p-card styleClass="h-full shadow-1 border-round-xl">

            <div class="flex justify-content-between align-items-start mb-3">
              <div>
                <h3 class="text-lg font-semibold text-gray-800 m-0">{{ class.name }}</h3>
                <p class="text-gray-500 text-sm mt-1 mb-0">{{ class.instructor }}</p>
              </div>
              <p-tag
                [value]="isFull(class) ? 'Lleno' : class.availableCapacity + ' cupos'"
                [severity]="isFull(class) ? 'danger' : 'success'" />
            </div>

            <div class="flex align-items-center gap-2 text-gray-500 text-sm mb-4">
              <i class="pi pi-calendar"></i>
              <span>{{ class.date }}</span>
            </div>

            <p-button
              [label]="isFull(class) ? 'Sin cupos' : 'Reservar'"
              [disabled]="isFull(class)"
              [loading]="reservingId === class.id"
              styleClass="w-full"
              (onClick)="reserve(class)" />

          </p-card>
        </div>
      }
    </div>
  }

  <!-- Empty state -->
  @if (!loading && classes.length === 0) {
    <p-message severity="info" text="No hay clases disponibles." styleClass="w-full" />
  }

</div>
